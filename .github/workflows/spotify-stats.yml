name: Update Spotify stats

# Refreshes src/content/hobbies/music-stats.json from Spotify once a day and commits only if it changed.
# Needs repository secrets SPOTIFY_CLIENT_ID, SPOTIFY_CLIENT_SECRET, SPOTIFY_REFRESH_TOKEN
# (see scripts/spotify-auth.mjs). Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "17 13 * * *" # daily, about 6am Pacific
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch top artists and tracks
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: node scripts/spotify-stats.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/content/hobbies/music-stats.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/hobbies/music-stats.json
          git commit -m "Update Spotify stats"
          git push
